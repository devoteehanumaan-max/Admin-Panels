<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Access - Neon Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .premium-container {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .btn-access-panel {
            background: linear-gradient(135deg, #ff00cc, #3333ff);
            color: white;
            padding: 25px 50px;
            font-size: 2rem;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 0 30px rgba(255, 0, 204, 0.5);
            margin: 2rem;
        }
        .btn-access-panel:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(255, 0, 204, 0.8);
        }
        .btn-access-panel i {
            font-size: 2.5rem;
        }
        .back-btn {
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <img src="https://i.ibb.co/1GBn25c5/VID-20260310-172522-610-ezgif-com-video-to-gif-converter.gif" alt="Logo" class="nav-logo">
            <div class="nav-credits">
                <i class="fas fa-coins"></i> Credits: {{ session.credits }}
            </div>
            <div class="nav-user">
                <i class="fas fa-user-circle"></i> {{ session.username }}
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="premium-container">
            <!-- Button Redirects to Telegram Bot -->
            <a href="https://t.me/StoreUpdateBot" target="_blank" class="btn-access-panel">
                <i class="fab fa-telegram"></i>
                Access Store Bot
                <i class="fas fa-external-link-alt"></i>
            </a>
            
            <!-- Back to Dashboard Button -->
            <div class="back-btn">
                <a href="{{ url_for('user_dashboard') }}" class="btn-secondary">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </div>
</body>
</html>
