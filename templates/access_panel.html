<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Access</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body style="
background: #0d1117;
color: white;
font-family: Arial;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
flex-direction: column;
">

    <h1 style="
    color: #ff00cc;
    text-shadow: 0 0 15px #ff00cc;
    ">
        👑 Premium Access Panel
    </h1>

    <p style="margin-top: 20px; color: #aaa;">
        Welcome {{ user.username if user else 'User' }}
    </p>

    <a href="{{ url_for('dashboard') }}" style="
    margin-top: 30px;
    padding: 12px 20px;
    background: linear-gradient(135deg,#ff00cc,#3333ff);
    border-radius: 12px;
    color: white;
    text-decoration: none;
    font-weight: bold;
    ">
        Back To Dashboard
    </a>

</body>
</html>
