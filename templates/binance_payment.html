<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance Crypto Payment - Neon Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <img src="https://i.ibb.co/1GBn25c5/VID-20260310-172522-610-ezgif-com-video-to-gif-converter.gif" alt="Logo" class="nav-logo">
            <div class="nav-credits">Credits: {{ session.credits }}</div>
            <div class="nav-user">{{ session.username }}</div>
            <a href="{{ url_for('payment_page') }}" class="btn-logout">← Back</a>
        </div>
    </nav>

    <div class="container">
        <div class="card" style="text-align: center; padding: 1rem;">
            <div style="background: linear-gradient(145deg, #f0b90b, #d4a00a); padding: 1rem; border-radius: 40px; margin-bottom: 1rem;">
                <i class="fab fa-bitcoin" style="font-size: 2rem;"></i>
                <i class="fab fa-ethereum" style="font-size: 2rem;"></i>
                <i class="fab fa-btc" style="font-size: 2rem;"></i>
                <h2 style="color: black; margin-top: 0.5rem;">Crypto Payment Gateway</h2>
                <p style="color: black;">Pay with USDT, BTC, ETH, BNB</p>
            </div>

            <!-- Crypto Checkout Iframe -->
            <iframe 
                src="https://binance.digamber.in/" 
                width="100%" 
                height="550px" 
                style="border: none; border-radius: 12px;"
                title="Crypto Payment Gateway">
            </iframe>

            <div style="margin-top: 1.5rem; padding: 1rem; background: rgba(255,255,255,0.05); border-radius: 10px;">
                <p style="color: var(--text-secondary); font-size: 0.9rem;">
                    <i class="fas fa-shield-alt"></i> Secure payment processing via Binance
                </p>
                <p style="color: var(--text-secondary); font-size: 0.9rem;">
                    <i class="fas fa-clock"></i> Payment will be confirmed automatically
                </p>
            </div>

            <!-- Support Section -->
            <div class="support-section" style="margin-top: 1.5rem;">
                <h3><i class="fas fa-headset"></i> Need Help?</h3>
                <div class="support-grid" style="grid-template-columns: 1fr 1fr;">
                    <a href="{{ telegram_support }}" target="_blank" class="support-card telegram">
                        <i class="fab fa-telegram"></i>
                        <span>Telegram Support</span>
                    </a>
                    <a href="{{ whatsapp_channel }}" target="_blank" class="support-card whatsapp">
                        <i class="fab fa-whatsapp"></i>
                        <span>WhatsApp Channel</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <style>
        .support-section {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            border: 1px solid var(--accent-pink);
        }
        .support-section h3 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            text-align: center;
        }
        .support-grid {
            display: grid;
            gap: 1rem;
        }
        .support-card {
            padding: 0.8rem;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .support-card i { font-size: 1.2rem; }
        .support-card span { font-weight: bold; font-size: 0.9rem; }
        .support-card.telegram {
            background: linear-gradient(145deg, #0088cc, #006699);
            color: white;
        }
        .support-card.whatsapp {
            background: linear-gradient(145deg, #25D366, #128C7E);
            color: white;
        }
        .support-card:hover {
            transform: translateY(-3px);
        }
    </style>
</body>
</html>
